<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="atividade.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Loja de Produtos</h1>
        <p>Escolha seu produto favorito e preencha seu nome para comprar</p>
    </header>

    <main>
        <section class="produtos">
            <div class="card">
                <h2>Cadeira</h2>
                <p class="descricao">cadeira confortável com ótima qualidade</p>
                <input type="text" placeholder="Digite seu nome">
                <button>Comprar</button>
            </div>

            <div class="card">
                <h2>Mouse</h2>
                <p class="descricao">mouse com design moderno para jogos</p>
                <input type="text" placeholder="Digite seu nome">
                <button>Comprar</button>
            </div>

            <div class="card">
                <h2>Fone</h2>
                <p class="descricao">Fonegamer, confortável e com rgd</p>
                <input type="text" placeholder="Digite seu nome">
                <button>Comprar</button>
            </div>

        </section>
    </main>
</body>
</html>
