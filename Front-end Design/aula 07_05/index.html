<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            margin: 0;
            padding: 0;
        }

        .scene{
            margin: 80px auto;
            width: 210px;
            aspect-ratio: 4 / 5; /*4 de largura e 5 de altura*/
            position: relative;
            perspective: 1000px;
        }

        .carousel{
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 30s infinite linear;
        }

        .carousel > img{
            position: absolute;
            left: 0;
            top: 0;
            width: 190px;
            border-radius: 10px;
            aspect-ratio: 4 / 5;
            transform: rotateY(var(--i)) translateZ(288px);
        }

        @keyframes rotate {
            0% {
                transform: rotateY(360deg);
            }

            100% {
                transform: rotateY(0);
            }
        }

        .carousel > img:first-child {
            border-radius: 50%;
            object-fit: cover;
            animation: spin-sphere 3s infinite linear;
            transform: rotateY(0deg) translateZ(0px); 
        }

        @keyframes spin-sphere {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="carousel">
            <img src="thom.jpg">
            <img style="--i:000deg" src="pablo.avif">
            <img style="--i:040deg" src="bends.jpg">
            <img style="--i:080deg" src="ok.png">
            <img style="--i:120deg" src="kid a.jpg">
            <img style="--i:160deg" src="hail.jpg">
            <img style="--i:200deg" src="amn.avif">
            <img style="--i:240deg" src="rainbows.jpg">
            <img style="--i:280deg" src="king.jpg">
            <img style="--i:320deg" src="moon.jpg">
        </div>
    </div>
</body>
</html>
